name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test backend
        run: npm run test:backend

      - name: Test frontend
        run: npm run test:unit

      - name: Build
        run: npm run build

  # Temporary one-time job; removed automatically after synchronization.
  sync-upstream:
    if: "${{ github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'chore: execute upstream sync') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bridge histories, merge upstream, and publish candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/TedLin1993/taiwan-fin-hub.git
          git fetch upstream main

          sync_commit="48fbb617ba4bedf388b451fd6cff3529834c736d"
          if ! git merge-base --is-ancestor "$sync_commit" HEAD; then
            echo "Previous sync commit is not an ancestor of main"
            exit 1
          fi

          upstream_base=""
          sync_tree="$(git rev-parse "${sync_commit}^{tree}")"
          while IFS= read -r candidate; do
            if [ "$(git rev-parse "${candidate}^{tree}")" = "$sync_tree" ]; then
              upstream_base="$candidate"
              break
            fi
          done < <(git rev-list upstream/main)

          if [ -z "$upstream_base" ]; then
            sync_time="$(git show -s --format=%cI "$sync_commit")"
            upstream_base="$(git rev-list -1 --before="$sync_time" upstream/main)"
            echo "No exact tree match; using upstream commit before previous sync time: $upstream_base"
          else
            echo "Matched previous sync tree to upstream commit: $upstream_base"
          fi

          if [ -z "$upstream_base" ]; then
            echo "Unable to determine an upstream merge base"
            exit 1
          fi

          read -r -a sync_parents <<< "$(git show -s --format=%P "$sync_commit")"
          git replace --graft "$sync_commit" "${sync_parents[@]}" "$upstream_base"

          set +e
          git merge --no-ff -X ours upstream/main -m "Merge upstream/main into main"
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            git checkout --ours -- . || true
            git add -A
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "Unresolved conflicts remain:"
              git diff --name-only --diff-filter=U
              exit 1
            fi
            git commit -m "Merge upstream/main into main"
          fi

          git replace -d "$sync_commit"
          echo "Merge parents: $(git show -s --format=%P HEAD)"
          git push --force origin HEAD:automation/upstream-merged-candidate

      - name: Install merged dependencies
        run: npm ci

      - name: Typecheck merged result
        run: npm run typecheck

      - name: Test merged backend
        run: npm run test:backend

      - name: Test merged frontend
        run: npm run test:unit

      - name: Build merged result
        run: npm run build

      - name: Remove temporary synchronization setup
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/ci.yml <<'EOF'
          name: CI

          on:
            push:
            pull_request:

          jobs:
            validate:
              runs-on: ubuntu-latest
              timeout-minutes: 15
              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Setup Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm

                - name: Install dependencies
                  run: npm ci

                - name: Typecheck
                  run: npm run typecheck

                - name: Test backend
                  run: npm run test:backend

                - name: Test frontend
                  run: npm run test:unit

                - name: Build
                  run: npm run build
          EOF

          rm -f .github/workflows/sync-upstream-once-main-20260724.yml
          rm -f .github/sync-upstream-trigger-20260724
          rm -f .github/sync-upstream-pr-trigger-20260724
          rm -f .github/execute-upstream-sync-20260724
          rm -f .github/execute-upstream-sync-final-20260724
          rm -f .github/execute-upstream-sync-run-20260724
          rm -f .github/execute-upstream-sync-final-run-20260724
          rm -f .github/execute-upstream-sync-index-run-20260724
          rm -f .github/execute-upstream-sync-bridge-run-20260724
          rm -f .github/execute-upstream-sync-report-run-20260724
          rm -f .github/execute-upstream-sync-candidate-run-20260724
          rm -f .github/upstream-validation-report-20260724.txt
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: clean up temporary upstream sync setup"
          fi

      - name: Push synchronized main and remove temporary branches
        shell: bash
        run: |
          set -euo pipefail
          git push origin main
          for branch in \
            automation/execute-upstream-sync-20260724 \
            automation/execute-upstream-sync-final-20260724 \
            automation/execute-upstream-sync-run-20260724 \
            automation/execute-upstream-sync-final-run-20260724 \
            automation/execute-upstream-sync-index-run-20260724 \
            automation/execute-upstream-sync-bridge-run-20260724 \
            automation/execute-upstream-sync-report-run-20260724 \
            automation/execute-upstream-sync-candidate-run-20260724 \
            automation/fix-sync-workflow-syntax-20260724 \
            automation/register-sync-workflow-20260724 \
            automation/run-upstream-sync-20260724 \
            automation/sync-upstream-20260724 \
            automation/trigger-upstream-sync-20260724 \
            automation/upstream-conflict-report \
            automation/upstream-merged-candidate; do
            git push origin --delete "$branch" || true
          done
