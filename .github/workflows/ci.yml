name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test backend
        run: npm run test:backend

      - name: Test frontend
        run: npm run test:unit

      - name: Build
        run: npm run build

  # Temporary one-time job; removed after synchronization.
  sync-upstream:
    if: "${{ github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'chore: execute upstream sync') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bridge histories and create merged candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/TedLin1993/taiwan-fin-hub.git
          git fetch upstream main

          main_before="$(git rev-parse HEAD)"
          upstream_head="$(git rev-parse upstream/main)"
          sync_commit="48fbb617ba4bedf388b451fd6cff3529834c736d"

          upstream_base=""
          sync_tree="$(git rev-parse "${sync_commit}^{tree}")"
          while IFS= read -r candidate; do
            if [ "$(git rev-parse "${candidate}^{tree}")" = "$sync_tree" ]; then
              upstream_base="$candidate"
              break
            fi
          done < <(git rev-list upstream/main)

          if [ -z "$upstream_base" ]; then
            sync_time="$(git show -s --format=%cI "$sync_commit")"
            upstream_base="$(git rev-list -1 --before="$sync_time" upstream/main)"
          fi

          read -r -a sync_parents <<< "$(git show -s --format=%P "$sync_commit")"
          git replace --graft "$sync_commit" "${sync_parents[@]}" "$upstream_base"

          set +e
          git merge --no-ff -X ours upstream/main -m "Merge upstream/main into main"
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            git checkout --ours -- . || true
            git add -A
            if git diff --name-only --diff-filter=U | grep -q .; then
              git diff --name-only --diff-filter=U
              exit 1
            fi
            git commit -m "Merge upstream/main into main"
          fi

          git replace -d "$sync_commit"

          git checkout "$main_before" -- apps/web/src
          git checkout upstream/main -- \
            apps/web/src/app \
            apps/web/src/data \
            apps/web/src/shared \
            apps/web/src/testing \
            apps/web/src/features/activity/ActivityPage.svelte \
            apps/web/src/features/activity/components \
            apps/web/src/features/activity/model \
            apps/web/src/features/assets/AssetsPage.svelte \
            apps/web/src/features/assets/model \
            apps/web/src/features/invoices/InvoicesPage.svelte \
            apps/web/src/features/overview/OverviewPage.svelte \
            apps/web/src/features/overview/components \
            apps/web/src/features/overview/model \
            apps/web/src/features/settings/SettingsPage.svelte \
            apps/web/src/features/settings/components \
            apps/web/src/features/settings/connectors

          python - <<'PY'
          from pathlib import Path

          path = Path("apps/web/src/features/settings/Settings.svelte")
          content = path.read_text(encoding="utf-8")

          source_marker = "  ];\n\n  const connectorFields"
          taishin_source = '''    {
              id: "taishin",
              title: "台新銀行",
              description: "信用卡額度、帳單與即時消費",
            },
          '''
          if 'id: "taishin"' not in content:
              content = content.replace(
                  source_marker,
                  taishin_source + source_marker,
                  1,
              )

          field_marker = "  };\n\n  const jobs = createQuery"
          taishin_fields = '''    taishin: [
              { key: "userId", label: "身分證字號／統編", type: "text" },
              { key: "account", label: "使用者代號", type: "text" },
              { key: "password", label: "使用者密碼", type: "password" },
              {
                key: "lookbackMonths",
                label: "帳單往回月份（最多 6 期）",
                type: "number",
                placeholder: "6",
              },
            ],
          '''
          if "    taishin: [" not in content:
              content = content.replace(
                  field_marker,
                  taishin_fields + field_marker,
                  1,
              )

          path.write_text(content, encoding="utf-8")
          PY

          git add -A
          git commit -m "Resolve frontend architecture merge and add Taishin settings"

          merge_commit="$(git rev-parse HEAD)"
          merge_tree="$(git rev-parse HEAD^{tree})"
          {
            echo "MAIN_BEFORE=$main_before"
            echo "UPSTREAM_HEAD=$upstream_head"
            echo "UPSTREAM_BASE=$upstream_base"
            echo "MERGE_COMMIT=$merge_commit"
            echo "MERGE_TREE=$merge_tree"
          } > /tmp/upstream-merge-metadata.txt

          git bundle create /tmp/upstream-merged.bundle HEAD
          git archive --format=tar.gz -o /tmp/upstream-merged-tree.tar.gz HEAD

      - name: Upload merged candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: upstream-merged-candidate
          path: |
            /tmp/upstream-merged.bundle
            /tmp/upstream-merged-tree.tar.gz
            /tmp/upstream-merge-metadata.txt
          if-no-files-found: error
          retention-days: 1

      - name: Install merged dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee /tmp/upstream-validation-npm-ci.log

      - name: Typecheck merged result
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee /tmp/upstream-validation-typecheck.log

      - name: Test merged backend
        shell: bash
        run: |
          set -o pipefail
          npm run test:backend 2>&1 | tee /tmp/upstream-validation-test-backend.log

      - name: Test merged frontend
        shell: bash
        run: |
          set -o pipefail
          npm run test:unit 2>&1 | tee /tmp/upstream-validation-test-frontend.log

      - name: Build merged result
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/upstream-validation-build.log

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-validation-logs
          path: /tmp/upstream-validation-*.log
          if-no-files-found: warn
          retention-days: 1
