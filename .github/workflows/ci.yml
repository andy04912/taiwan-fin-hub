name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test backend
        run: npm run test:backend

      - name: Test frontend
        run: npm run test:unit

      - name: Build
        run: npm run build

  # Temporary one-time job; removed automatically after synchronization.
  sync-upstream:
    if: "${{ github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'chore: execute upstream sync') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Merge upstream while preserving local conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/TedLin1993/taiwan-fin-hub.git
          git fetch upstream main

          set +e
          git merge --no-ff -X ours upstream/main -m "Merge upstream/main into main"
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            echo "Resolving every remaining unmerged index entry in favor of current main"
            git checkout --ours -- . || true
            git add -A

            if git diff --name-only --diff-filter=U | grep -q .; then
              conflict_report="$(git diff --name-only --diff-filter=U)"
              printf '%s\n' "$conflict_report" > /tmp/upstream-conflicts.txt
              echo "Unresolved conflicts remain:"
              cat /tmp/upstream-conflicts.txt

              git merge --abort || git reset --hard HEAD
              git checkout -B automation/upstream-conflict-report main
              mkdir -p .github
              cp /tmp/upstream-conflicts.txt .github/upstream-conflicts-20260724.txt
              git add .github/upstream-conflicts-20260724.txt
              git commit -m "chore: record unresolved upstream conflicts"
              git push --force origin HEAD:automation/upstream-conflict-report
              exit 1
            fi

            git commit -m "Merge upstream/main into main"
          fi

      - name: Validate merged result
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run test:backend
          npm run test:unit
          npm run build

      - name: Remove temporary synchronization setup
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/ci.yml <<'EOF'
          name: CI

          on:
            push:
            pull_request:

          jobs:
            validate:
              runs-on: ubuntu-latest
              timeout-minutes: 15
              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Setup Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm

                - name: Install dependencies
                  run: npm ci

                - name: Typecheck
                  run: npm run typecheck

                - name: Test backend
                  run: npm run test:backend

                - name: Test frontend
                  run: npm run test:unit

                - name: Build
                  run: npm run build
          EOF

          rm -f .github/workflows/sync-upstream-once-main-20260724.yml
          rm -f .github/sync-upstream-trigger-20260724
          rm -f .github/sync-upstream-pr-trigger-20260724
          rm -f .github/execute-upstream-sync-20260724
          rm -f .github/execute-upstream-sync-final-20260724
          rm -f .github/execute-upstream-sync-run-20260724
          rm -f .github/execute-upstream-sync-final-run-20260724
          rm -f .github/execute-upstream-sync-index-run-20260724
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: clean up temporary upstream sync setup"
          fi

      - name: Push synchronized main and remove temporary branches
        shell: bash
        run: |
          set -euo pipefail
          git push origin main
          for branch in \
            automation/execute-upstream-sync-20260724 \
            automation/execute-upstream-sync-final-20260724 \
            automation/execute-upstream-sync-run-20260724 \
            automation/execute-upstream-sync-final-run-20260724 \
            automation/execute-upstream-sync-index-run-20260724 \
            automation/fix-sync-workflow-syntax-20260724 \
            automation/register-sync-workflow-20260724 \
            automation/run-upstream-sync-20260724 \
            automation/sync-upstream-20260724 \
            automation/trigger-upstream-sync-20260724 \
            automation/upstream-conflict-report; do
            git push origin --delete "$branch" || true
          done
