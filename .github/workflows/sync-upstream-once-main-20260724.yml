name: Sync upstream once from merged PR

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write

jobs:
  sync-upstream:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.title, 'chore: run upstream sync')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge upstream main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/TedLin1993/taiwan-fin-hub.git
          git fetch upstream main
          git merge --no-ff upstream/main -m "Merge upstream/main into main"

      - name: Remove temporary synchronization files
        shell: bash
        run: |
          rm -f .github/workflows/sync-upstream-once-main-20260724.yml
          rm -f .github/sync-upstream-trigger-20260724
          rm -f .github/sync-upstream-pr-trigger-20260724
          git add -A
          git commit -m "chore: remove temporary upstream sync files"

      - name: Push synchronized main
        shell: bash
        run: |
          git push origin main
          git push origin --delete automation/sync-upstream-20260724 || true
          git push origin --delete automation/trigger-upstream-sync-20260724 || true
          git push origin --delete automation/run-upstream-sync-20260724 || true
