name: Cleanup upstream sync branches

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  cleanup:
    if: "${{ startsWith(github.event.pull_request.title, 'chore: cleanup upstream sync branches') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete temporary branches
        shell: bash
        run: |
          set -u
          branches=(
            automation/execute-upstream-sync-20260724
            automation/execute-upstream-sync-final-20260724
            automation/execute-upstream-sync-run-20260724
            automation/execute-upstream-sync-final-run-20260724
            automation/execute-upstream-sync-index-run-20260724
            automation/execute-upstream-sync-bridge-run-20260724
            automation/execute-upstream-sync-report-run-20260724
            automation/execute-upstream-sync-candidate-run-20260724
            automation/execute-upstream-sync-artifact-run-20260724
            automation/execute-upstream-sync-dual-frontend-run-20260724
            automation/execute-upstream-sync-taishin-run-20260724
            automation/fix-sync-workflow-syntax-20260724
            automation/register-sync-workflow-20260724
            automation/run-upstream-sync-20260724
            automation/sync-upstream-20260724
            automation/trigger-upstream-sync-20260724
            automation/upstream-merged-candidate
            automation/upstream-conflict-report
            automation/settings-taishin-helper
            automation/publish-taishin-settings-blob-20260724
            automation/cleanup-upstream-sync-branches-20260724
          )

          for branch in "${branches[@]}"; do
            git push origin --delete "$branch" || true
          done
