name: Execute Upstream Incremental Sync V2

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: execute-upstream-incremental-sync-v2
  cancel-in-progress: false

jobs:
  sync:
    if: "${{ startsWith(github.event.pull_request.title, 'chore: execute upstream incremental sync v2') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply upstream increment and validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exec > >(tee /tmp/upstream-sync-v2.log) 2>&1

          git config user.name "taiwan-fin-hub-updater"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/TedLin1993/taiwan-fin-hub.git
          git fetch --no-tags upstream main

          BASE=$(sed -n 's/^LAST_SYNCED_UPSTREAM_SHA=//p' docs/upstream-sync-playbook.md | head -n 1)
          UPSTREAM_HEAD=$(git rev-parse upstream/main)
          BRANCH="sync/upstream-${UPSTREAM_HEAD:0:12}-${GITHUB_RUN_ID}"

          test -n "$BASE"
          git cat-file -e "$BASE^{commit}"
          if [ "$BASE" = "$UPSTREAM_HEAD" ]; then
            echo "Already up to date."
            exit 0
          fi

          git checkout -b "$BRANCH"
          git diff --binary --full-index --find-renames "$BASE" "$UPSTREAM_HEAD" > /tmp/taiwan-fin-hub-upstream.patch
          git apply --3way --index /tmp/taiwan-fin-hub-upstream.patch

          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/lib/types.ts')
          text = path.read_text(encoding='utf-8')
          old = 'export type View = PrimaryView | DetailView | MobileSettingsView | "more";'
          new = 'export type View = PrimaryView | DetailView | MobileSettingsView | "more" | "sync-notifications";'
          if old in text:
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          npm ci
          npm run typecheck
          npm run test:backend
          npm run test:unit
          npm run build
          git diff --check

          python - <<PY
          from pathlib import Path
          import re
          path = Path('docs/upstream-sync-playbook.md')
          text = path.read_text(encoding='utf-8')
          text = re.sub(r'^LAST_SYNCED_UPSTREAM_SHA=.*$', 'LAST_SYNCED_UPSTREAM_SHA=$UPSTREAM_HEAD', text, flags=re.MULTILINE)
          path.write_text(text, encoding='utf-8')
          PY

          git add -A
          git commit -m "chore: 同步 upstream/main 至 ${UPSTREAM_HEAD:0:12}"
          SYNC_COMMIT=$(git rev-parse HEAD)

          python - <<PY
          from pathlib import Path
          import re
          path = Path('docs/upstream-sync-playbook.md')
          text = path.read_text(encoding='utf-8')
          text = re.sub(r'^LAST_SYNC_COMMIT=.*$', 'LAST_SYNC_COMMIT=$SYNC_COMMIT', text, flags=re.MULTILINE)
          path.write_text(text, encoding='utf-8')
          PY

          git add docs/upstream-sync-playbook.md
          git commit -m "docs: 更新 upstream 同步基準"
          git push -u origin "$BRANCH"

          BODY=$(cat <<EOF
          ## 同步內容

          - Upstream 基準：\`$BASE\`
          - Upstream 最新：\`$UPSTREAM_HEAD\`
          - 僅套用兩者之間的增量
          - 保留目前 App Shell 與客製化 UI
          - 補齊舊 UI 的 \`sync-notifications\` View 相容型別

          ## 驗證

          - \`npm run typecheck\`
          - \`npm run test:backend\`
          - \`npm run test:unit\`
          - \`npm run build\`
          - \`git diff --check\`
          EOF
          )

          gh pr create --base main --head "$BRANCH" --title "chore: 同步 upstream/main 至 ${UPSTREAM_HEAD:0:12}" --body "$BODY"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-sync-v2-failure-${{ github.run_id }}
          path: /tmp/upstream-sync-v2.log
          if-no-files-found: warn
          retention-days: 7
