name: Trim UI UX Pro Max Skill Bundle

on:
  push:
    branches:
      - agent/install-ui-ux-pro-max-skill
    paths:
      - .github/workflows/trim-ui-ux-pro-max-skill.yml

permissions:
  contents: write

jobs:
  trim:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout installation branch
        uses: actions/checkout@v4
        with:
          ref: agent/install-ui-ux-pro-max-skill
          fetch-depth: 0

      - name: Keep only requested Skill
        run: |
          rm -rf \
            .codex/skills/banner-design \
            .codex/skills/brand \
            .codex/skills/design-system \
            .codex/skills/design \
            .codex/skills/slides \
            .codex/skills/ui-styling
          rm .github/workflows/trim-ui-ux-pro-max-skill.yml

      - name: Commit scoped installation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .codex .github/workflows/trim-ui-ux-pro-max-skill.yml
          git commit -m "保留 UI UX Pro Max 主 Skill"
          git push origin HEAD:agent/install-ui-ux-pro-max-skill
