name: Publish Taishin settings blob

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  publish:
    if: "${{ startsWith(github.event.pull_request.title, 'chore: publish taishin settings blob') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add Taishin settings and publish helper branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python - <<'PY'
          from pathlib import Path

          path = Path("apps/web/src/features/settings/Settings.svelte")
          content = path.read_text(encoding="utf-8")

          source_marker = "  ];\n\n  const connectorFields"
          taishin_source = '''    {
              id: "taishin",
              title: "台新銀行",
              description: "信用卡額度、帳單與即時消費",
            },
          '''
          if 'id: "taishin"' not in content:
              content = content.replace(source_marker, taishin_source + source_marker, 1)

          field_marker = "  };\n\n  const jobs = createQuery"
          taishin_fields = '''    taishin: [
              { key: "userId", label: "身分證字號／統編", type: "text" },
              { key: "account", label: "使用者代號", type: "text" },
              { key: "password", label: "使用者密碼", type: "password" },
              {
                key: "lookbackMonths",
                label: "帳單往回月份（最多 6 期）",
                type: "number",
                placeholder: "6",
              },
            ],
          '''
          if "    taishin: [" not in content:
              content = content.replace(field_marker, taishin_fields + field_marker, 1)

          path.write_text(content, encoding="utf-8")
          PY

          git add apps/web/src/features/settings/Settings.svelte
          git commit -m "chore: prepare Taishin settings blob"
          git push --force origin HEAD:automation/settings-taishin-helper
